<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8bc34a">
<title>菜园叠叠消 · Sheep Match</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg-top:#cdea9c; --bg-mid:#a8d568; --bg-low:#8bc34a;
    --card-face:#fdf6e0; --card-side:#d8c89a; --card-edge:#6b5b34;
    --wood:#a9743f; --wood-dark:#7c5326; --groove:#3d2812;
    --ink:#3a2f1a; --accent:#2e86de; --accent-dark:#1c5a9a;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 20% 0%, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-low) 100%);
    color:var(--ink); touch-action:manipulation;
  }
  /* ---------- 布局骨架:头部 / 棋盘(弹性) / 底部操作区 ---------- */
  #app { height:100dvh; display:flex; flex-direction:column;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:10px 14px; }
  #levelTag { background:#2b2620; color:#ffe9b0; font-weight:700; font-size:clamp(14px,3.8vw,20px);
              padding:6px 18px; border-radius:999px; letter-spacing:.2em; box-shadow:0 2px 0 rgba(0,0,0,.25); }
  header .spacer { flex:1; }
  .icon-btn { width:40px; height:40px; border:none; border-radius:12px; cursor:pointer;
              background:linear-gradient(#64a8f0,#2e86de); color:#fff; font-size:19px;
              box-shadow:0 3px 0 var(--accent-dark); display:flex; align-items:center; justify-content:center; }
  .icon-btn:active { transform:translateY(2px); box-shadow:0 1px 0 var(--accent-dark); }
  .icon-btn.off { filter:grayscale(1) brightness(.8); }
  .icon-btn:focus-visible, .tile:focus-visible, .prop-btn:focus-visible { outline:3px solid #fff59d; outline-offset:2px; }

  #boardWrap { flex:1 1 auto; position:relative; overflow:hidden; min-height:0; }
  #boardInner { position:absolute; left:0; top:0; transform-origin:0 0; }

  /* ---------- 牌(原创样式:圆角卡 + 顶面高光 + 侧面厚度) ---------- */
  .tile { position:absolute; width:123px; height:138px; cursor:pointer; }
  .tile .body { position:absolute; inset:0; border-radius:16px;
                background:linear-gradient(175deg, var(--card-face) 0%, #f4e8c8 78%, var(--card-side) 100%);
                border:3px solid var(--card-edge); box-shadow:0 5px 0 #b8a678, 0 7px 10px rgba(40,60,10,.30); }
  .tile .body::after { content:""; position:absolute; inset:4px 6px auto 6px; height:14%; border-radius:10px;
                background:rgba(255,255,255,.5); }
  .tile svg { position:absolute; left:50%; top:50%; width:74%; height:74%;
              transform:translate(-50%,-52%); filter:drop-shadow(0 2px 1px rgba(60,40,0,.25)); }
  .tile.covered { cursor:default; }
  .tile.covered .body { filter:saturate(.35) brightness(.72); box-shadow:0 4px 0 #8a7a58; }
  .tile.covered::after { content:""; position:absolute; inset:0; border-radius:16px; background:rgba(30,40,10,.28); }
  .tile.enter { animation:dropIn .45s cubic-bezier(.25,1.3,.5,1) backwards; }
  @keyframes dropIn { from { transform:translateY(-240px); opacity:0; } }
  .tile.picked-anim .body { animation:pop .18s ease; }
  @keyframes pop { 50% { transform:scale(1.1); } }

  /* ---------- 暂存区 ---------- */
  #moveoutRow { flex:0 0 auto; display:none; justify-content:center; gap:clamp(28px,12vw,90px);
                padding:2px 0 6px; min-height:0; }
  #moveoutRow.show { display:flex; }
  .mo-col { position:relative; width:var(--small-w); height:var(--small-h); }
  .mo-col .tile { width:var(--small-w); height:var(--small-h); border-radius:12px; }
  .mo-col .tile .body { border-width:2.5px; box-shadow:0 3px 0 #b8a678; border-radius:12px; }

  /* ---------- 槽位托盘(原创木盘) ---------- */
  #tray { flex:0 0 auto; margin:4px auto 6px; width:min(96vw,520px);
          --small-w:clamp(40px,12.4vw,68px); --small-h:clamp(45px,13.9vw,76px);
          padding:8px 10px 10px; border-radius:20px;
          background:linear-gradient(#c08a52,#a9743f 40%,#8a5c2e);
          box-shadow:0 4px 0 var(--wood-dark), inset 0 2px 2px rgba(255,240,200,.5), 0 6px 14px rgba(40,60,10,.25); }
  #trayGrooves { display:flex; gap:6px; justify-content:center; padding:8px 6px; min-height:calc(var(--small-h) + 14px);
                 background:linear-gradient(var(--groove), #2b1b0c); border-radius:12px;
                 box-shadow:inset 0 4px 8px rgba(0,0,0,.65); }
  .groove { flex:1; max-width:76px; min-height:var(--small-h); border-radius:8px;
            background:rgba(255,235,190,.06); box-shadow:inset 0 2px 5px rgba(0,0,0,.5); position:relative; }
  #slotLayer { position:fixed; inset:0; pointer-events:none; z-index:600; }
  #slotLayer .tile { width:var(--small-w); height:var(--small-h); cursor:default; }
  #slotLayer .tile .body { border-radius:12px; border-width:2.5px; box-shadow:0 3px 0 #b8a678; }
  #slotLayer .tile.crushing { animation:crushAnim .34s forwards; }
  @keyframes crushAnim { 40% { transform:scale(1.18); filter:brightness(1.4); } 100% { transform:scale(0); opacity:0; } }

  /* ---------- 道具栏 ---------- */
  #propsBar { flex:0 0 auto; display:flex; justify-content:center; gap:clamp(14px,5vw,34px); padding:8px 10px 12px; }
  .prop-btn { position:relative; width:clamp(86px,26vw,124px); height:clamp(48px,13vw,62px); border:none; border-radius:16px;
              cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
              background:linear-gradient(#66b3f5,#2e86de); box-shadow:0 4px 0 var(--accent-dark), inset 0 2px 3px rgba(255,255,255,.45);
              color:#fff; font-size:clamp(15px,4vw,19px); font-weight:800; letter-spacing:.15em;
              text-shadow:0 1px 0 rgba(0,0,0,.3); }
  .prop-btn:active { transform:translateY(2px); box-shadow:0 2px 0 var(--accent-dark); }
  .prop-btn svg { width:26px; height:26px; }
  .prop-btn .p-cnt { position:absolute; top:-9px; right:-7px; min-width:26px; height:26px; padding:0 6px;
              border-radius:13px; background:#2b2620; color:#ffe082; font:800 14px/26px Arial; text-align:center;
              border:2px solid #fff; letter-spacing:0; }
  .prop-btn.disabled { filter:grayscale(.85) brightness(.75); }

  /* ---------- 弹窗 ---------- */
  #overlay { position:fixed; inset:0; background:rgba(20,40,10,.55); z-index:1000; display:none;
             align-items:center; justify-content:center; padding:20px; }
  #overlay.show { display:flex; }
  .dialog { width:min(88vw,420px); background:linear-gradient(#fffbe8,#fdeec0); border:4px solid #b98d4f;
            border-radius:22px; padding:28px 24px 24px; text-align:center;
            box-shadow:0 12px 34px rgba(20,40,10,.4); animation:dlgIn .28s cubic-bezier(.3,1.4,.6,1); }
  @keyframes dlgIn { from { transform:scale(.6); opacity:0; } }
  .dialog h2 { font-size:clamp(24px,7vw,34px); color:#8a5a1a; letter-spacing:.2em; margin-bottom:10px; }
  .dialog p { font-size:clamp(14px,4vw,17px); color:#9a7040; line-height:1.7; margin-bottom:20px; }
  .dialog .btns { display:flex; flex-direction:column; gap:12px; }
  .d-btn { border:none; height:52px; border-radius:26px; font-size:clamp(16px,4.6vw,20px); font-weight:800;
           letter-spacing:.2em; cursor:pointer; color:#fff; }
  .d-btn:active { transform:scale(.96); }
  .d-btn.green { background:linear-gradient(#8fd95e,#54a832); box-shadow:0 4px 0 #3a7a20; }
  .d-btn.blue  { background:linear-gradient(#66b3f5,#2e86de); box-shadow:0 4px 0 var(--accent-dark); }
  .d-btn.plain { background:#efe6cf; color:#8a7a5a; box-shadow:0 4px 0 #cbbb96; }

  #toast { position:fixed; top:calc(env(safe-area-inset-top) + 64px); left:50%; transform:translateX(-50%);
           background:rgba(30,30,24,.82); color:#fff; font-size:15px; padding:9px 22px; border-radius:999px;
           z-index:1100; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
  #hint { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 8px);
          font-size:12px; color:rgba(40,60,20,.55); letter-spacing:.05em; pointer-events:none; }
  @media (prefers-reduced-motion: reduce) {
    .tile.enter { animation:none; } #slotLayer .tile.crushing { animation-duration:.01s; }
    .dialog { animation:none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="levelTag">第一关</div>
    <div class="spacer"></div>
    <button class="icon-btn" id="sfxBtn" title="音效开关" aria-label="音效开关">♪</button>
    <button class="icon-btn" id="exitBtn" title="退出本局" aria-label="退出">✕</button>
  </header>

  <div id="boardWrap"><div id="boardInner"></div></div>

  <div id="moveoutRow"></div>
  <div id="tray"><div id="trayGrooves"></div></div>

  <div id="propsBar">
    <button class="prop-btn" id="btnMoveout" title="移出:槽内前3块进入暂存区">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/><path d="M5 21h14"/></svg>
      移出<span class="p-cnt">3</span></button>
    <button class="prop-btn" id="btnUndo" title="撤回:退回最后入槽的牌">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      撤回<span class="p-cnt">3</span></button>
    <button class="prop-btn" id="btnShuffle" title="洗牌:棋盘剩余牌重新分配类型">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4l10 10h4"/><path d="M3 17h4l3-3"/><path d="M14 7h7"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
      洗牌<span class="p-cnt">3</span></button>
  </div>
</div>

<div id="slotLayer"></div>
<div id="toast"></div>
<div id="hint">点按明牌入槽 · 集齐三张同类即可消除</div>
<div id="overlay"></div>

<script type="module">
import { buildLevel, LEVEL_COUNT } from "./levels.mjs";
import { createGame, pick, useMoveout, useUndo, useShuffle, revive,
         isCovered, canPick, effectiveCount, SLOT_COUNT } from "./game-core.mjs";

/* ================= 原创音效(WebAudio 合成,无外部素材) ================= */
const sfx = (() => {
  let ctx = null, on = true;
  const ensure = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); return ctx; };
  function tone(freq, dur, { type = "sine", vol = .18, when = 0, slide = 0 } = {}) {
    if (!on) return; const c = ensure();
    const t0 = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + .02);
  }
  return {
    unlock() { ensure(); },
    toggle() { on = !on; return on; },
    click()  { tone(760, .07, { type: "triangle", vol: .15, slide: -240 }); },
    enter()  { tone(520, .08, { type: "sine", vol: .12 }); },
    crush()  { [660, 880, 1100].forEach((f, i) => tone(f, .12, { type: "triangle", when: i * .05, vol: .16, slide: -180 })); },
    moveout(){ tone(300, .22, { type: "sawtooth", vol: .08, slide: 260 }); },
    shuffle(){ for (let i = 0; i < 6; i++) tone(420 + i * 90, .05, { type: "square", when: i * .045, vol: .05 }); },
    fail()   { tone(220, .5, { type: "sawtooth", vol: .12, slide: -120 }); },
    win()    { [523, 659, 784, 1046].forEach((f, i) => tone(f, .22, { type: "triangle", when: i * .12, vol: .18 })); },
  };
})();

/* ================= 视图 ================= */
const $ = s => document.querySelector(s);
const boardWrap = $("#boardWrap"), boardInner = $("#boardInner");
const slotLayer = $("#slotLayer"), moveoutRow = $("#moveoutRow"), overlay = $("#overlay");

const UNIT = 12;                    // 1 网格单位 = 12 设计像素
const TILE_W = 10.24 * UNIT, TILE_H = 11.52 * UNIT;

let game = null, levelIdx = 0, flying = false;

const tileXY = t => ({ x: t.col * UNIT + 4 * UNIT, y: t.row * UNIT }); // 牌左上角(设计坐标)

function makeTileEl(t) {
  const el = document.createElement("div");
  el.className = "tile";
  el.dataset.id = t.id;
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  el.innerHTML = `<div class="body"></div><svg aria-hidden="true"><use/></svg>`;
  updateTileFace(el, t.type);
  el.addEventListener("pointerdown", () => { if (canPick(game, t.id).ok) { el.classList.add("picked-anim"); sfx.click(); } });
  el.addEventListener("pointerup", () => act(() => pick(game, t.id)));
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(() => pick(game, t.id)); } });
  return el;
}

function updateTileFace(el, type) {
  const icon = `assets/original/icons.svg#i${type}`;
  const use = el.querySelector("use");
  if (use.getAttribute("href") !== icon) {
    use.setAttribute("href", icon);
    el.setAttribute("aria-label", `牌 ${type}`);
  }
}

/** 单一动作入口:执行 + 播放事件 + 重渲染 */
function act(fn) {
  if (!game || flying) return;
  const r = fn();
  if (!r.ok) {
    const tips = { "slot-full": "槽位已满!", "covered": "这张牌被压住了", "not-top": "只能点暂存区顶牌",
                   "no-prop": "道具次数用完了", "empty-slot": "槽里没有牌", "empty-board": "棋盘上没有牌",
                   "nothing-to-undo": "没有可撤回的牌", "not-playing": "当前不可操作" };
    if (tips[r.reason]) toast(tips[r.reason]);
    return;
  }
  playEvents(r.events);
  render();
}

function playEvents(events) {
  for (const e of events) {
    if (e.t === "enter-slot") sfx.enter();
    if (e.t === "crush") sfx.crush();
    if (e.t === "enter-moveout" || e.t === "return-moveout" || e.t === "return-board") sfx.moveout();
    if (e.t === "retype") sfx.shuffle();
    if (e.t === "fail") sfx.fail();
    if (e.t === "win") sfx.win();
  }
}

/* ---------- 渲染 ---------- */
function startLevel(idx) {
  levelIdx = idx;
  game = createGame(buildLevel(idx));
  boardInner.innerHTML = ""; moveoutRow.innerHTML = ""; slotLayer.innerHTML = "";
  $("#levelTag").textContent = idx === 0 ? "第一关" : "第二关";
  hideDialog();
  let i = 0;
  for (const t of game.tiles.values()) {
    const el = makeTileEl(t);
    el.classList.add("enter");
    el.style.animationDelay = (i++ * 10) + "ms";
    boardInner.appendChild(el);
  }
  setTimeout(() => boardInner.querySelectorAll(".tile").forEach(el => el.classList.remove("enter")), 700);
  layoutBoard(); render();
}

function layoutBoard() {
  if (!game) return;
  const tiles = [...game.tiles.values()].filter(t => t.area === "board");
  if (!tiles.length && !boardInner.children.length) return;
  // 牌阵包围盒(含边距)
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  const consider = t => { const p = tileXY(t); minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
                          maxX = Math.max(maxX, p.x + TILE_W); maxY = Math.max(maxY, p.y + TILE_H); };
  tiles.forEach(consider);
  if (!tiles.length) { minX = minY = 0; maxX = maxY = 1; }
  const pad = UNIT * 2;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const k = Math.min(boardWrap.clientWidth / (maxX - minX), boardWrap.clientHeight / (maxY - minY), 1.6);
  const cx = (boardWrap.clientWidth - (maxX - minX) * k) / 2;
  const cy = (boardWrap.clientHeight - (maxY - minY) * k) / 2;
  boardInner.style.transform = `translate(${cx - minX * k}px, ${cy - minY * k}px) scale(${k})`;
  for (const el of boardInner.children) {
    const t = game.tiles.get(el.dataset.id);
    if (t && t.area === "board") { const p = tileXY(t); el.style.left = p.x + "px"; el.style.top = p.y + "px";
                                   el.style.zIndex = String(10 + t.layer); }
  }
}

function render() {
  // 棋盘牌:遮挡态
  for (const el of boardInner.children) {
    const t = game.tiles.get(el.dataset.id);
    if (!t) continue;
    if (t.area !== "board") { el.style.display = "none"; continue; }
    el.style.display = "";
    const covered = isCovered(game, t.id);
    updateTileFace(el, t.type);
    el.classList.toggle("covered", covered);
    el.tabIndex = covered ? -1 : 0;
    el.setAttribute("aria-disabled", String(covered));
  }
  // 槽位牌:与凹槽对齐
  slotLayer.innerHTML = "";
  const grooves = $("#trayGrooves");
  game.slot.forEach((id, i) => {
    const t = game.tiles.get(id);
    const el = makeTileEl(t);
    el.classList.add("slot-tile");
    el.tabIndex = -1;
    el.setAttribute("aria-disabled", "true");
    const groove = grooves.children[i];
    if (groove) {
      const gr = groove.getBoundingClientRect();
      el.style.left = (gr.left + gr.width / 2) + "px";
      el.style.top = (gr.top + gr.height / 2) + "px";
      el.style.transform = "translate(-50%,-50%)";
    }
    slotLayer.appendChild(el);
  });
  // 暂存区
  moveoutRow.innerHTML = "";
  const hasMo = game.moveout.some(c => c.length > 0);
  moveoutRow.classList.toggle("show", hasMo);
  game.moveout.forEach((col, ci) => {
    const colEl = document.createElement("div"); colEl.className = "mo-col";
    col.forEach((id, i) => {
      const t = game.tiles.get(id);
      const el = makeTileEl(t);
      el.style.left = (i * 4) + "px"; el.style.top = (-i * 6) + "px";
      el.style.zIndex = String(i);
      const isTop = i === col.length - 1;
      el.classList.toggle("covered", !isTop);
      el.tabIndex = isTop ? 0 : -1;
      el.setAttribute("aria-disabled", String(!isTop));
      if (!isTop) { el.style.pointerEvents = "none"; }
      colEl.appendChild(el);
    });
    moveoutRow.appendChild(colEl);
  });
  // 道具
  const props = { btnMoveout: "moveout", btnUndo: "undo", btnShuffle: "shuffle" };
  for (const [bid, key] of Object.entries(props)) {
    const btn = $("#" + bid);
    btn.querySelector(".p-cnt").textContent = game.props[key];
    btn.classList.toggle("disabled", game.props[key] <= 0);
  }
  // 终局弹窗
  if (game.phase === "won") showWin();
  if (game.phase === "failed") showFail();
}

/* ---------- 弹窗 ---------- */
function showDialog(html) { overlay.innerHTML = html; overlay.classList.add("show"); }
function hideDialog() { overlay.classList.remove("show"); overlay.innerHTML = ""; }
function showWin() {
  if (levelIdx + 1 < LEVEL_COUNT) {
    showDialog(`<div class="dialog"><h2>过关!</h2><p>第${levelIdx + 1}关完成<br>下一关的牌阵更厚,小心槽位</p>
      <div class="btns"><button class="d-btn green" id="dlgNext">进入第${levelIdx + 2}关</button></div></div>`);
    $("#dlgNext").onclick = () => startLevel(levelIdx + 1);
  } else {
    showDialog(`<div class="dialog"><h2>大丰收!</h2><p>全部关卡完成<br>菜园叠叠消达成</p>
      <div class="btns"><button class="d-btn green" id="dlgRetry">再来一局</button>
      <button class="d-btn plain" id="dlgBack">回到第一关</button></div></div>`);
    $("#dlgRetry").onclick = () => startLevel(levelIdx);
    $("#dlgBack").onclick = () => startLevel(0);
  }
}
function showFail() {
  const canRevive = !game.revived && game.slot.length > 0;
  showDialog(`<div class="dialog"><h2>槽位满了</h2><p>${canRevive ? "还可以抢救一次:免费移出前 3 张" : "本局复活次数已用完"}</p>
    <div class="btns">
      ${canRevive ? `<button class="d-btn green" id="dlgRevive">复活(移出 3 张)</button>` : ""}
      <button class="d-btn blue" id="dlgRestart">重新开始本关</button>
      <button class="d-btn plain" id="dlgBack2">回到第一关</button>
    </div></div>`);
  if (canRevive) $("#dlgRevive").onclick = () => { hideDialog(); act(() => revive(game)); };
  $("#dlgRestart").onclick = () => startLevel(levelIdx);
  $("#dlgBack2").onclick = () => startLevel(0);
}

/* ---------- 杂项 ---------- */
let toastTimer = 0;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, 1500);
}
$("#btnMoveout").onclick = () => act(() => useMoveout(game));
$("#btnUndo").onclick = () => act(() => useUndo(game));
$("#btnShuffle").onclick = () => act(() => useShuffle(game));
$("#sfxBtn").onclick = () => { const on = sfx.toggle(); $("#sfxBtn").classList.toggle("off", !on); };
$("#exitBtn").onclick = () => showDialog(`<div class="dialog"><h2>退出本局?</h2><p>当前进度将丢失</p>
  <div class="btns"><button class="d-btn blue" id="dlgExitOk">确认退出</button>
  <button class="d-btn plain" id="dlgExitNo">继续游戏</button></div></div>`);
document.addEventListener("click", e => {
  if (e.target.id === "dlgExitOk") { hideDialog(); startLevel(0); }
  if (e.target.id === "dlgExitNo") hideDialog();
});
addEventListener("resize", () => { layoutBoard(); if (game) render(); });

/* 空槽凹槽骨架 */
(function initTray() {
  const grooves = $("#trayGrooves");
  for (let i = 0; i < SLOT_COUNT; i++) {
    const g = document.createElement("div"); g.className = "groove"; grooves.appendChild(g);
  }
})();

const requestedLevel = Number(new URLSearchParams(location.search).get("level"));
startLevel(Number.isInteger(requestedLevel) && requestedLevel >= 0 && requestedLevel < LEVEL_COUNT ? requestedLevel : 0);

/* 调试/E2E:按保留解自动通关(?solve=1) */
if (new URLSearchParams(location.search).get("solve")) {
  window.__solve = async () => {
    const level = buildLevel(levelIdx);
    for (const id of level.solution) {
      if (game.phase !== "playing") break;
      act(() => pick(game, id));
      await new Promise(r => setTimeout(r, 60));
    }
  };
  window.__solve();
}
</script>
</body>
