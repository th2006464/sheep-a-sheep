<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#63c24d">
<title>羊了个羊 · 复刻版</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#4ca43a; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; touch-action:manipulation; }
  #viewport { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#2f7a26; }
  #stage { position:relative; width:750px; height:1334px; transform-origin:center center; overflow:hidden;
           background:linear-gradient(#7ecb5f,#5aab3e 55%,#4a9a35); }

  /* 顶部信息栏 */
  #hud { position:absolute; top:0; left:0; right:0; height:110px; padding:34px 24px 0; display:flex; align-items:center; justify-content:space-between; z-index:900; }
  .hud-left { display:flex; align-items:center; gap:14px; }
  #levelTag { background:rgba(0,0,0,.28); color:#fff; font-size:30px; font-weight:600; padding:12px 26px; border-radius:32px; letter-spacing:2px; }
  #bgmBtn { width:72px; height:72px; border:none; border-radius:50%; background:rgba(0,0,0,.28); color:#fff; font-size:34px; cursor:pointer; }
  .props { display:flex; gap:18px; }
  .prop-btn { position:relative; width:96px; height:96px; border:none; border-radius:20px; background:rgba(255,255,255,.92); box-shadow:0 4px 0 rgba(0,0,0,.18); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; transition:transform .08s; }
  .prop-btn:active { transform:scale(.92); }
  .prop-btn img { width:52px; height:52px; object-fit:contain; pointer-events:none; }
  .prop-btn .p-name { font-size:17px; color:#5a4a3a; font-weight:600; pointer-events:none; }
  .prop-btn .p-cnt { position:absolute; top:-8px; right:-8px; min-width:34px; height:34px; border-radius:17px; background:#f9542f; color:#fff; font-size:19px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 6px; border:2px solid #fff; }
  .prop-btn.disabled { filter:grayscale(1); opacity:.55; }

  /* 棋盘区 */
  #board { position:absolute; left:0; top:120px; width:750px; height:830px; z-index:10;
           background-image:url('assets/wallpaper.png'); background-size:cover; background-position:center; }
  #board::after { content:""; position:absolute; inset:0; background:rgba(30,90,20,.18); pointer-events:none; }
  .block { position:absolute; width:120px; height:135px; transform-origin:center; cursor:pointer; will-change:transform,opacity; }
  .block img { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .block .mask { opacity:0; transition:opacity .25s; }
  .block.covered .mask { opacity:.62; }
  .block.enter { animation:dropIn .5s cubic-bezier(.3,1.4,.6,1) backwards; }
  @keyframes dropIn { from { transform:translateY(-560px) scale(1); opacity:0; } }

  /* 暂存区(移出道具) */
  #moveoutArea { position:absolute; left:0; right:0; top:960px; height:130px; display:none; justify-content:center; gap:220px; z-index:500; }
  #moveoutArea.show { display:flex; }
  .mo-col { position:relative; width:130px; height:130px; }
  .mo-col .block { width:104px; height:117px; }

  /* 槽位栏 */
  #slotBar { position:absolute; left:0; right:0; top:1108px; height:170px; display:flex; justify-content:center; align-items:center; gap:6px; z-index:600; }
  .slot { width:96px; height:108px; position:relative; }
  .slot img { position:absolute; inset:0; width:100%; height:100%; }
  #slotLayer { position:absolute; inset:0; }
  #slotLayer .block { width:96px; height:108px; cursor:default; }
  #slotLayer .block.crushing { animation:crushAnim .32s forwards; }
  @keyframes crushAnim { 40% { transform:scale(1.22); } 100% { transform:scale(0); opacity:0; } }

  /* 弹窗 */
  #mask { position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:1000; display:none; align-items:center; justify-content:center; }
  #mask.show { display:flex; }
  .dialog { width:600px; background:linear-gradient(#fff8e8,#ffedb8); border-radius:28px; padding:44px 36px 36px; text-align:center; border:4px solid #b97941; box-shadow:0 10px 40px rgba(0,0,0,.35); animation:popIn .3s cubic-bezier(.3,1.5,.6,1); }
  @keyframes popIn { from { transform:scale(.5); opacity:0; } }
  .dialog h2 { font-size:46px; color:#8a4d1d; margin-bottom:16px; letter-spacing:4px; }
  .dialog p { font-size:26px; color:#9a6a3c; margin-bottom:30px; line-height:1.6; }
  .dialog .btns { display:flex; flex-direction:column; gap:18px; }
  .d-btn { border:none; height:92px; border-radius:46px; font-size:34px; font-weight:700; letter-spacing:4px; cursor:pointer; transition:transform .08s; }
  .d-btn:active { transform:scale(.95); }
  .d-btn.green { background:linear-gradient(#8fe06a,#54b53a); color:#fff; box-shadow:0 6px 0 #3d8f28; }
  .d-btn.blue  { background:linear-gradient(#7ec5ff,#3f9df0); color:#fff; box-shadow:0 6px 0 #2a6fb0; }
  .d-btn.gray  { background:#e8e2d5; color:#8a7a63; box-shadow:0 6px 0 #c6bda9; }

  /* 开场遮罩(点击开始,解锁音频) */
  #startMask { position:absolute; inset:0; z-index:1200; background:rgba(20,60,15,.78); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; }
  #startMask h1 { font-size:76px; color:#ffe9a8; text-shadow:0 4px 0 #7a4a12, 0 8px 24px rgba(0,0,0,.4); letter-spacing:8px; }
  #startMask .sub { font-size:28px; color:#d6f5c4; }
  #startMask .big-btn { margin-top:30px; width:420px; height:110px; border:none; border-radius:55px; font-size:44px; font-weight:800; letter-spacing:10px; color:#fff; background:linear-gradient(#ffd45e,#f5a623); box-shadow:0 8px 0 #b97910, 0 14px 30px rgba(0,0,0,.35); cursor:pointer; animation:breath 1.6s ease-in-out infinite; }
  @keyframes breath { 50% { transform:scale(1.06); } }
  #toast { position:absolute; top:200px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); color:#fff; font-size:28px; padding:16px 34px; border-radius:40px; z-index:1100; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="hud">
      <div class="hud-left">
        <div id="levelTag">第一关</div>
        <button id="bgmBtn" title="音乐">♪</button>
      </div>
      <div class="props">
        <button class="prop-btn" id="btnMoveout"><img src="assets/ui/prop-moveout.svg" alt=""><span class="p-name">移出</span><span class="p-cnt">3</span></button>
        <button class="prop-btn" id="btnUndo"><img src="assets/ui/prop-undo.svg" alt=""><span class="p-name">撤销</span><span class="p-cnt">3</span></button>
        <button class="prop-btn" id="btnShuffle"><img src="assets/ui/prop-shuffle.svg" alt=""><span class="p-name">洗牌</span><span class="p-cnt">3</span></button>
      </div>
    </div>

    <div id="board"></div>
    <div id="moveoutArea"></div>
    <div id="slotBar"></div>
    <div id="slotLayer"></div>

    <div id="toast"></div>
    <div id="mask"></div>
    <div id="startMask">
      <h1>羊了个羊</h1>
      <div class="sub">经典三消 · 复刻版</div>
      <div class="sub" style="font-size:22px;color:#a8d89a">点击下方按钮开始游戏(将开启背景音乐)</div>
      <button class="big-btn" id="startBtn">开始游戏</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================
 * 羊了个羊复刻版 —— 玩法机制依据对原版 APK 的逆向分析实现:
 *   · 7 格槽位栏(failNumber=7),3 个同类型消除(CrushMatchBlockCount=3)
 *   · 入槽按类型插入:插到同类型块之后;同类型数量为 3 的倍数则排到末尾
 *   · 遮挡判定:更高层块落在 ±8 网格单位窗口内即被压(显示黑遮罩、不可点)
 *   · 道具:移出(前3块进入3列暂存区,仅每列顶块可点)、撤销(退回最后入槽
 *     的块,发生消除即清空撤销栈)、洗牌(棋盘剩余块重新分配类型)
 *   · 失败:有效槽位数 ≥7 且无可消除三连且全部落定,延迟 1 秒结算
 *   · 复活 = 使用一次"移出 3 块"
 * ========================================================= */

const SLOT_COUNT   = 7;     // 槽位总数
const MATCH_COUNT  = 3;     // 同类型消除数量
const BLOCK_W      = 120, BLOCK_H = 135;   // 原版方块设计尺寸
const SLOT_SCALE   = 0.8;                   // 入槽缩放(原版 newScale=.8)
const SLOT_GAP     = BLOCK_W * SLOT_SCALE;  // 槽位间距 96
const OCCLUDE_WIN  = 8;                     // 遮挡窗口:±8 网格单位
const UNIT_X       = 750 / 64;              // 小网格单位宽(8列×8单位)

/* ---------- 音效(原版 APK 提取) ---------- */
const SFX = {
  click:   "audio/click.mp3",      // clickBlock:按压可点击的块
  crush:   "audio/crush.mp3",      // 三连消除
  moveout: "audio/moveout.mp3",    // 移出/撤销道具
  shuffle: "audio/shuffle.mp3",    // 洗牌道具
  levelInit:"audio/levelInit.mp3", // 开局块下落
  bgm:     "audio/bgm.mp3",        // 游戏内循环 BGM (game_cycle)
  bgmMain: "audio/bgm_main.mp3",   // 主界面 BGM
};
const audioPool = {};
let bgmAudio = null, bgmOn = true;
function playSfx(name, vol = 1) {
  try {
    const a = audioPool[name] || (audioPool[name] = new Audio(SFX[name]));
    a.volume = vol; a.currentTime = 0; a.play().catch(()=>{});
  } catch (e) {}
}
function startBgm() {
  if (!bgmAudio) { bgmAudio = new Audio(SFX.bgm); bgmAudio.loop = true; bgmAudio.volume = .55; }
  bgmAudio.play().catch(()=>{});
}

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
function mulberry32(seed) {          // 种子随机(关卡可复现)
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function showToast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._tm); t._tm = setTimeout(() => t.style.opacity = 0, 1600);
}
function vibrate() { if (navigator.vibrate) navigator.vibrate(15); }

/* ---------- 关卡设计(原创布局:层数 + 网格单位行列) ---------- */
/* 每块: {layer, row, col} —— row/col 为 8 单位/块的网格坐标,层间错位形成半重叠 */
function buildLevel(levelIdx) {
  const layers = [];
  function grid(rows, cols, offRow, offCol) {
    const arr = [];
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        arr.push({ row: offRow + r * 8, col: offCol + c * 8 });
    return arr;
  }
  if (levelIdx === 0) {
    /* 第一关:3 层,约 48 块,简单热身 */
    layers.push(grid(4, 6, 0,  8));
    layers.push(grid(3, 5, 4, 14));
    layers.push(grid(1, 3, 10, 20));
  } else {
    /* 第二关:7 层,约 147 块,地狱难度 */
    layers.push(grid(5, 8, 0,  4));
    layers.push(grid(4, 7, 4,  8));
    layers.push(grid(4, 6, 8, 12));
    layers.push(grid(3, 5, 8, 16));
    layers.push(grid(2, 4, 12, 20));
    layers.push(grid(1, 3, 16, 24));
    layers.push(grid(1, 2, 18, 28));
  }
  const cells = [];
  layers.forEach((arr, li) => arr.forEach(p => cells.push({ layer: li, row: p.row, col: p.col })));

  /* 分配类型:数量恒为 3 的倍数,种子洗牌 */
  const typePool = levelIdx === 0 ? 8 : 12;           // 使用的类型数
  const rand = mulberry32(0x5EE9 + levelIdx * 7919);
  const nTriples = Math.floor(cells.length / MATCH_COUNT);
  const total = nTriples * MATCH_COUNT;
  cells.length = total;
  const bag = [];
  for (let i = 0; i < total; i++) bag.push(i % typePool + 1);
  for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
  cells.forEach((c, i) => c.type = bag[i]);
  return cells;
}

/* ---------- 游戏状态 ---------- */
const state = {
  level: 0, running: false, over: false,
  blocks: [],            // 棋盘上的块
  slot: [],              // 槽位内(有序)
  undoStack: [],         // 撤销栈:已入槽块(消除时清空)
  moveout: [[], [], []], // 三列暂存区
  props: { moveout: 3, undo: 3, shuffle: 3 },
  revives: 0,
};

const boardEl = $("#board"), slotBarEl = $("#slotBar"), slotLayerEl = $("#slotLayer"), moveoutEl = $("#moveoutArea");

/* ---------- 槽位栏(空槽底图) ---------- */
function renderSlotBar() {
  slotBarEl.innerHTML = "";
  for (let i = 0; i < SLOT_COUNT; i++) {
    const d = document.createElement("div"); d.className = "slot";
    d.innerHTML = `<img src="assets/blocks/block_bg.png" alt="">`;
    slotBarEl.appendChild(d);
  }
}

/* ---------- 方块 DOM ---------- */
function makeBlockEl(type) {
  const el = document.createElement("div");
  el.className = "block";
  el.innerHTML = `<img src="assets/blocks/block_${type}.png" alt="">` +
                 `<img class="mask" src="assets/blocks/blackMask.png" alt="">`;
  return el;
}

/* ---------- 开局 ---------- */
function startLevel(levelIdx, first = false) {
  state.level = levelIdx; state.running = true; state.over = false;
  state.blocks = []; state.slot = []; state.undoStack = []; state.moveout = [[], [], []];
  boardEl.innerHTML = ""; slotLayerEl.innerHTML = ""; moveoutEl.classList.remove("show"); moveoutEl.innerHTML = "";
  $("#levelTag").textContent = levelIdx === 0 ? "第一关" : "第二关";
  hideDialog();

  const cells = buildLevel(levelIdx);
  cells.forEach((c, i) => {
    const el = makeBlockEl(c.type);
    el.classList.add("enter");
    el.style.animationDelay = (i * 12) + "ms";
    setTimeout(() => el.classList.remove("enter"), 800 + i * 12);
    boardEl.appendChild(el);
    const b = { ...c, el, inSlot: false, ready: true };
    el.addEventListener("pointerdown", () => onPressBlock(b), { passive: true });
    el.addEventListener("pointerup",   () => onReleaseBlock(b), { passive: true });
    el.addEventListener("pointerleave",() => { el._pressed = false; el.style.zIndex = ""; });
    state.blocks.push(b);
  });
  layoutBoard();
  playSfx("levelInit", .8);
  updateProps();
}

/* ---------- 棋盘布局与遮挡 ---------- */
function boardXY(b) {
  const unit = UNIT_X;
  const x = b.col * unit + (750 / 8) / 2;                 // 原版:x = col*unit + 大列宽/2
  const y = b.row * unit + BLOCK_H / 2;                   // 原版:y = row*unit + 块高/2
  return [x, y];
}
function layoutBoard() {
  for (const b of state.blocks) {
    const [x, y] = boardXY(b);
    b.el.style.transform = `translate(${x - BLOCK_W / 2}px, ${y - BLOCK_H / 2}px)`;
    b.el.style.zIndex = String(100 + b.layer * 10);
  }
  refreshCover();
}
function refreshCover() {
  for (const b of state.blocks) {
    let covered = false;
    for (const o of state.blocks) {
      if (o.layer > b.layer &&
          Math.abs(o.col - b.col) < OCCLUDE_WIN &&
          Math.abs(o.row - b.row) < OCCLUDE_WIN) { covered = true; break; }
    }
    b.covered = covered;
    b.el.classList.toggle("covered", covered);
  }
}

/* ---------- 点击棋盘块 ---------- */
function onPressBlock(b) {
  if (!state.running || b.inSlot || b.covered) return;
  b.el._pressed = true;
  vibrate(); playSfx("click");
  b.el.style.transform += " scale(1.12)";
  b.el.style.zIndex = "5000";
}
function onReleaseBlock(b) {
  if (!b.el._pressed) return;
  b.el._pressed = false;
  if (!state.running || b.inSlot || b.covered) return;
  if (effectiveSlotCount() >= SLOT_COUNT) {  // 原版:有效槽位≥7 时弹回
    showToast("槽位已满!");
    layoutBoard();
    return;
  }
  pickBlock(b);
}

/* ---------- 入槽(按类型插入) ---------- */
function effectiveSlotCount() {
  const arr = state.slot;
  let n = arr.length;
  for (let i = 0; i + 2 < arr.length; i++)
    if (arr[i].type === arr[i+1].type && arr[i+1].type === arr[i+2].type) n -= 3;
  return n;
}
function insertPos(type) {
  /* 原版 getNewPosit:插到最后一个同类型之后;同类型数量为 3 的倍数则排末尾 */
  for (let i = state.slot.length - 1; i >= 0; i--) {
    if (state.slot[i].type === type) {
      let same = 0;
      for (let j = i; j >= 0; j--) if (state.slot[j].type === type) same++;
      if (same % MATCH_COUNT === 0) break;
      return i + 1;
    }
  }
  return state.slot.length;
}
function pickBlock(b) {
  state.blocks = state.blocks.filter(x => x !== b);
  b.inSlot = true; b.fromMoveout = -1;
  const idx = insertPos(b.type);
  state.slot.splice(idx, 0, b);
  state.undoStack.push(b);

  /* DOM 迁移:棋盘 → 槽位层,带飞行动画 */
  const [x, y] = boardXY(b);
  b.el.classList.remove("covered");
  slotLayerEl.appendChild(b.el);
  b.el.style.transition = "none";
  b.el.style.transform = `translate(${x - BLOCK_W/2}px, ${120 + y - BLOCK_H/2}px) scale(1)`;
  b.el.getBoundingClientRect(); // 强制回流
  b.el.style.transition = "transform .28s cubic-bezier(.4,.9,.5,1)";
  requestAnimationFrame(() => layoutSlot());
  refreshCover();
  setTimeout(() => { checkCrush(); checkFail(); }, 320);
}

/* ---------- 槽位渲染与消除 ---------- */
function layoutSlot() {
  state.slot.forEach((b, i) => {
    const x = i * SLOT_GAP + (750 - SLOT_COUNT * SLOT_GAP) / 2 + 0;  // 居中排布
    const y = 1108 + 6;
    b.el.style.zIndex = String(600 + i);
    b.el.style.transform = `translate(${x}px, ${y}px) scale(1)`;
  });
}
function checkCrush() {
  const arr = state.slot;
  for (let i = 0; i + 2 < arr.length; i++) {
    if (arr[i].type === arr[i+1].type && arr[i+1].type === arr[i+2].type) {
      const trio = arr.splice(i, 3);
      state.undoStack = [];                    // 原版:消除清空撤销栈
      playSfx("crush");
      trio.forEach((b, k) => {
        b.el.classList.add("crushing");
        b.el.style.zIndex = String(700 + k);
        setTimeout(() => b.el.remove(), 380);
      });
      layoutSlot();
      setTimeout(() => { checkCrush(); checkWin(); checkFail(); }, 300);
      return;
    }
  }
}
function checkFail() {
  if (state.over || !state.running) return;
  if (effectiveSlotCount() >= SLOT_COUNT && state.slot.length >= SLOT_COUNT) {
    state.over = true;
    setTimeout(() => showFail(), 1000);        // 原版:延迟 1 秒结算
  }
}
function checkWin() {
  if (state.blocks.length === 0 && state.moveout.every(c => c.length === 0) && state.slot.length === 0) {
    state.running = false;
    if (state.level === 0) showWinNext();
    else showWinAll();
  }
}

/* ---------- 移出道具 ---------- */
function useMoveout() {
  if (!state.running || state.props.moveout <= 0) return;
  if (state.slot.length === 0) { showToast("槽位没有块"); return; }
  state.props.moveout--;
  const n = Math.min(state.slot.length, MATCH_COUNT);
  const moved = state.slot.splice(0, n);
  playSfx("moveout");
  moved.forEach((b, i) => {
    state.moveout[i].push(b);
    mountMoveout(i);
  });
  layoutSlot();
  updateProps();
  setTimeout(() => { checkFail(); }, 300);
}
function mountMoveout(col) {
  moveoutEl.classList.add("show");
  while (moveoutEl.children.length < 3) {
    const c = document.createElement("div"); c.className = "mo-col"; moveoutEl.appendChild(c);
  }
  const colEl = moveoutEl.children[col];
  colEl.innerHTML = "";
  state.moveout[col].forEach((b, i) => {
    const top = i === state.moveout[col].length - 1;
    b.inSlot = false; b.fromMoveout = col;
    colEl.appendChild(b.el);
    b.el.classList.remove("crushing");
    b.el.style.transition = "none";
    b.el.style.transform = `translate(${i * 5}px, ${i * 7}px)`;
    b.el.style.zIndex = String(i);
    b.el.classList.toggle("covered", !top);
    if (top) {
      b.el.onpointerdown = () => onPressBlock(b);
      b.el.onpointerup = () => onReleaseBlock(b);
    } else {
      b.el.onpointerdown = b.el.onpointerup = null;
    }
  });
}
/* 统一的松开处理:棋盘块与暂存区顶块共用 */
function onReleaseBlock(b) {
  if (!b.el._pressed) return;
  b.el._pressed = false;
  if (!state.running || b.inSlot || b.covered) return;
  if (effectiveSlotCount() >= SLOT_COUNT) { showToast("槽位已满!"); return; }
  if (b.fromMoveout >= 0) {
    state.moveout[b.fromMoveout] = state.moveout[b.fromMoveout].filter(x => x !== b);
    mountMoveout(b.fromMoveout);
    b.fromMoveout = -1;
  }
  pickBlock(b);
}

/* ---------- 撤销道具 ---------- */
function useUndo() {
  if (!state.running || state.props.undo <= 0) return;
  const b = state.undoStack.pop();
  if (!b) { showToast("没有可撤销的块"); return; }
  state.props.undo--;
  playSfx("moveout");
  state.slot = state.slot.filter(x => x !== b);
  b.inSlot = false;
  layoutSlot();
  /* 飞回棋盘原位 */
  state.blocks.push(b);
  boardEl.appendChild(b.el);
  b.el.style.transition = "transform .3s ease";
  b.el.onpointerdown = () => onPressBlock(b);
  b.el.onpointerup = () => onReleaseBlock(b);
  layoutBoard();
  updateProps();
}

/* ---------- 洗牌道具 ---------- */
function useShuffle() {
  if (!state.running || state.props.shuffle <= 0) return;
  if (state.blocks.length === 0) { showToast("棋盘没有块"); return; }
  state.props.shuffle--;
  playSfx("shuffle");
  const types = state.blocks.map(b => b.type);
  for (let i = types.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [types[i], types[j]] = [types[j], types[i]];
  }
  state.blocks.forEach((b, i) => {
    b.type = types[i];
    b.el.classList.add("shuffling");
    b.el.querySelector("img:not(.mask)").src = `assets/blocks/block_${b.type}.png`;
  });
  updateProps();
}

/* ---------- 道具 UI ---------- */
function updateProps() {
  const map = { btnMoveout: "moveout", btnUndo: "undo", btnShuffle: "shuffle" };
  for (const [id, key] of Object.entries(map)) {
    const btn = $("#" + id);
    btn.querySelector(".p-cnt").textContent = state.props[key];
    btn.classList.toggle("disabled", state.props[key] <= 0);
  }
}
$("#btnMoveout").onclick = useMoveout;
$("#btnUndo").onclick = useUndo;
$("#btnShuffle").onclick = useShuffle;
$("#bgmBtn").onclick = () => {
  bgmOn = !bgmOn;
  $("#bgmBtn").textContent = bgmOn ? "♪" : "✕";
  if (bgmOn) startBgm(); else if (bgmAudio) bgmAudio.pause();
};

/* ---------- 弹窗 ---------- */
function showDialog(html) { const m = $("#mask"); m.innerHTML = html; m.classList.add("show"); }
function hideDialog() { $("#mask").classList.remove("show"); $("#mask").innerHTML = ""; }

function showFail() {
  state.running = false;
  showDialog(`<div class="dialog">
    <h2>失败</h2>
    <p>槽位已被填满<br>还可以复活一次哦</p>
    <div class="btns">
      <button class="d-btn green" onclick="reviveGame()">视频复活(移出前3块)</button>
      <button class="d-btn blue" onclick="restartLevel()">重新开始本关</button>
      <button class="d-btn gray" onclick="backToFirst()">回到第一关</button>
    </div></div>`);
}
function showWinNext() {
  showDialog(`<div class="dialog">
    <h2>恭喜通关</h2>
    <p>第一关完成!<br>真正的挑战现在才开始…</p>
    <div class="btns">
      <button class="d-btn green" onclick="gotoLevel(1)">进入第二关</button>
    </div></div>`);
}
function showWinAll() {
  showDialog(`<div class="dialog">
    <h2>羊了个羊!</h2>
    <p>你竟然通关了地狱难度的第二关<br>确定不是开了挂?</p>
    <div class="btns">
      <button class="d-btn green" onclick="restartLevel()">再来一局</button>
      <button class="d-btn gray" onclick="backToFirst()">回到第一关</button>
    </div></div>`);
}
window.reviveGame = function() {
  /* 原版复活 = 使用一次移出 3 块 */
  hideDialog();
  state.over = false; state.running = true;
  const n = Math.min(state.slot.length, MATCH_COUNT);
  const moved = state.slot.splice(0, n);
  playSfx("moveout");
  moved.forEach((b, i) => { state.moveout[i].push(b); mountMoveout(i); });
  layoutSlot();
};
window.restartLevel = () => startLevel(state.level);
window.backToFirst = () => startLevel(0);
window.gotoLevel = i => startLevel(i);

/* ---------- 自适应缩放 ---------- */
function fitStage() {
  const s = Math.min(innerWidth / 750, innerHeight / 1334);
  $("#stage").style.transform = `scale(${s})`;
}
addEventListener("resize", fitStage); fitStage();

/* ---------- 启动 ---------- */
renderSlotBar();
$("#startBtn").onclick = () => {
  $("#startMask").style.display = "none";
  startBgm();
  startLevel(0, true);
};
</script>
</body>
</html>
